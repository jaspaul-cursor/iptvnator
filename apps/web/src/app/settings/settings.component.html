<div class="settings-container" data-test-id="settings-container">
    <form
        [formGroup]="settingsForm"
        (ngSubmit)="onSubmit()"
        class="settings-layout"
        novalidate
    >
        <!-- Page-level "Settings" h1 intentionally removed: the left rail
             already labels the page "Settings" (sg-nav-title), and each
             section below provides its own h3 + subtitle. -->
        <span class="visually-hidden" data-test-id="settings-page-header">
            {{ 'SETTINGS.TITLE' | translate }}
        </span>

        <div class="settings-content">
            <!-- Only the routed section renders. The parent keeps the shared
                 form alive across section switches, so edits staged on one
                 page survive a visit to another. -->
            @switch (activeSection()) {
                @case ('playback') {
                    <app-settings-playback-section
                        [form]="settingsForm"
                        [players]="players()"
                        [streamFormatEnum]="streamFormatEnum"
                        [supportsManagedExternalPlayers]="
                            supportsManagedExternalPlayers
                        "
                        [supportsExternalPlayerPathSettings]="
                            supportsExternalPlayerPathSettings
                        "
                        [supportsVodMultiSource]="supportsVodMultiSource"
                    />
                }
                @case ('epg') {
                    <app-settings-epg-section
                        [form]="settingsForm"
                        [epgUrl]="form.epgUrl"
                        [isClearingEpgData]="epg.isClearing()"
                        [epgViewModeOptions]="epgViewModeOptions"
                        (refreshEpg)="epg.refresh($event)"
                        (removeEpgSource)="form.removeEpgSource($event)"
                        (addEpgSource)="form.addEpgSource()"
                        (refreshAllEpg)="epg.refreshAll()"
                        (clearEpgData)="epg.clear()"
                        (selectEpgViewMode)="form.selectEpgViewMode($event)"
                    />
                }
                @case ('dashboard') {
                    <app-settings-dashboard-section [form]="settingsForm" />
                }
                @case ('tmdb') {
                    <app-settings-tmdb-section [form]="settingsForm" />
                }
                @case ('about') {
                    <app-settings-about-section
                        [version]="appVersion"
                        [buildCommit]="buildCommit"
                    />
                }
                @default {
                    <app-settings-general-section
                        [form]="settingsForm"
                        [languageEnum]="languageEnum"
                        [themeOptions]="themeOptions"
                        [coverSizeOptions]="coverSizeOptions"
                        [startupBehaviorOptions]="startupBehaviorOptions"
                        (selectTheme)="form.selectTheme($event)"
                        (selectCoverSize)="form.selectCoverSize($event)"
                    />
                }
            }
        </div>

        <!-- Discord-style unsaved-changes bar: appears the moment any edit
             makes the form dirty — on whichever section page — and vanishes
             once saved or discarded. It replaces the always-visible footer
             Save button of the single-scroll layout. -->
        @if (!settingsForm.pristine) {
            <footer class="unsaved-bar" data-test-id="settings-unsaved-bar">
                <div class="unsaved-bar__message">
                    <mat-icon>edit</mat-icon>
                    <span>{{ 'SETTINGS.UNSAVED_CHANGES' | translate }}</span>
                </div>
                <div class="unsaved-bar__actions">
                    <button
                        mat-button
                        type="button"
                        (click)="discardChanges()"
                        data-test-id="discard-settings"
                    >
                        {{ 'SETTINGS.DISCARD_CHANGES' | translate }}
                    </button>
                    <button
                        mat-flat-button
                        type="submit"
                        class="settings-save-button"
                        [disabled]="!settingsForm.valid"
                        data-test-id="save-settings"
                    >
                        <mat-icon>save</mat-icon>
                        {{ 'SETTINGS.SAVE_CHANGES' | translate }}
                    </button>
                </div>
            </footer>
        }
    </form>
</div>
